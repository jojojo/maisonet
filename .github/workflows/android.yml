name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'mobile/index.html'
      - 'resources/js/mobile/**'
      - 'resources/js/components/house-buddy.tsx'
      - 'public/logo.png'
      - 'public/mascot.png'
      - 'public/icon.png'
      - 'capacitor.config.ts'
      - 'vite.mobile.config.ts'
      - 'tsconfig.mobile.json'
      - 'package*.json'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - run: npx tsc --project tsconfig.mobile.json --noEmit
      - run: node --experimental-strip-types --test tests/frontend/mobile-api.test.mjs tests/frontend/mobile-session.test.mjs
      - run: npm run mobile:build
      - run: npx cap sync android
      - name: Build test APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: maisonet-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n net.eoloa.maisonet/.MainActivity
            sleep 12
            adb shell pidof net.eoloa.maisonet
            adb exec-out screencap -p > android/app/build/maisonet-launch.png
            adb shell uiautomator dump /sdcard/maisonet-ui.xml
            adb pull /sdcard/maisonet-ui.xml android/app/build/maisonet-ui.xml
            grep -q 'Bienvenue chez toi' android/app/build/maisonet-ui.xml
            adb exec-out screencap -p > android/app/build/maisonet-launch.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maisonet-android-launch
          path: |
            android/app/build/maisonet-launch.png
            android/app/build/maisonet-ui.xml
          if-no-files-found: ignore
          retention-days: 14
