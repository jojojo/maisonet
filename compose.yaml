services:
  app:
    image: ${MAISONET_IMAGE:-maisonet:latest}
    restart: unless-stopped
    environment:
      APP_NAME: Maisonnet
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${MAISONET_APP_KEY:?Set MAISONET_APP_KEY in Portainer}
      APP_URL: https://${MAISONET_HOST:-maisonet.eoloa.net}
      APP_TIMEZONE: Europe/Paris
      APP_LOCALE: fr
      APP_FALLBACK_LOCALE: fr
      TRUSTED_PROXIES: "*"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/storage/app/maisonet.sqlite
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "true"
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
      MAIL_MAILER: log
      REGISTRATION_CODE: ${MAISONET_REGISTRATION_CODE:?Set MAISONET_REGISTRATION_CODE in Portainer}
    volumes:
      - maisonet_storage:/var/www/html/storage
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik_proxy
      traefik.http.routers.maisonet.rule: Host(`${MAISONET_HOST:-maisonet.eoloa.net}`)
      traefik.http.routers.maisonet.entrypoints: websecure
      traefik.http.routers.maisonet.tls: "true"
      traefik.http.routers.maisonet.tls.certresolver: lets-encrypt
      traefik.http.services.maisonet.loadbalancer.server.port: "80"

volumes:
  maisonet_storage:

networks:
  proxy:
    external: true
    name: traefik_proxy
